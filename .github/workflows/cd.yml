name: CD – Chrome Web Store

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

defaults:
  run:
    working-directory: human-signal

jobs:
  publish:
    name: Publish to Chrome Web Store
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: human-signal/package.json

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('human-signal/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Stamp version
        run: npm version "$(node -p "require('./package.json').version").${{ github.run_number }}" --no-git-tag-version

      - name: Build & zip extension
        run: pnpm zip

      - name: Upload to Chrome Web Store
        run: |
          ZIP=$(ls .output/*.zip | head -1)
          pnpm exec chrome-webstore-upload upload --source "$ZIP" --auto-publish
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}

      - name: Upload zip artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-${{ github.run_number }}
          path: human-signal/.output/*.zip
          retention-days: 30
