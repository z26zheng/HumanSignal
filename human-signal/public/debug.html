<!DOCTYPE html>
<html>
<head>
  <title>HumanSignal Debug</title>
  <style>
    body { font: 13px/1.5 'SF Mono', 'Cascadia Code', 'Fira Code', monospace; background: #0f172a; color: #e2e8f0; padding: 20px; margin: 0; }
    h1 { font-size: 16px; color: #f8fafc; margin: 0 0 16px; }
    h2 { font-size: 13px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; margin: 20px 0 8px; border-bottom: 1px solid #1e293b; padding-bottom: 4px; }
    .section { background: #1e293b; border-radius: 8px; padding: 12px 16px; margin-bottom: 12px; }
    dl { display: grid; grid-template-columns: 140px 1fr; gap: 4px 12px; margin: 0; }
    dt { color: #94a3b8; }
    dd { margin: 0; color: #f8fafc; }
    .log-entry { padding: 4px 0; border-bottom: 1px solid #1e293b; font-size: 11px; }
    .log-time { color: #64748b; margin-right: 8px; }
    .log-level { margin-right: 8px; font-weight: 700; }
    .log-level--info { color: #38bdf8; }
    .log-level--warn { color: #fbbf24; }
    .log-level--error { color: #f87171; }
    .log-ctx { color: #a78bfa; margin-right: 8px; }
    .log-msg { color: #e2e8f0; }
    .refresh { background: #334155; color: #e2e8f0; border: 1px solid #475569; border-radius: 6px; padding: 6px 14px; cursor: pointer; font: inherit; }
    .refresh:hover { background: #475569; }
    #status { color: #22c55e; font-size: 11px; margin-left: 12px; }
    .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .toggle-row { display: flex; align-items: center; gap: 8px; }
    .toggle-label { color: #94a3b8; font-size: 12px; }
    .toggle-switch { position: relative; width: 36px; height: 20px; cursor: pointer; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-track { position: absolute; inset: 0; background: #334155; border-radius: 10px; transition: background 150ms; }
    .toggle-switch input:checked + .toggle-track { background: #22c55e; }
    .toggle-track::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; background: #f8fafc; border-radius: 50%; transition: transform 150ms; }
    .toggle-switch input:checked + .toggle-track::after { transform: translateX(16px); }
  </style>
</head>
<body>
  <h1>HumanSignal Debug Panel <span id="status"></span></h1>
  <div class="toolbar">
    <button class="refresh" id="refresh">Refresh</button>
    <div class="toggle-row">
      <span class="toggle-label">Debug pills</span>
      <label class="toggle-switch">
        <input type="checkbox" id="devModeToggle" />
        <span class="toggle-track"></span>
      </label>
    </div>
  </div>
  <div id="content">Loading...</div>
  <script src="debug.js"></script>
</body>
</html>
